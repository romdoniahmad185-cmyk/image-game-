<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Top Up Game</title>

    <!-- CSS -->
    <link rel="stylesheet" href="topup.css">
</head>
<body>

    <!-- Header -->
    <header class="topup-header">

        <a href="index.html" class="btn-back">
            
        </a>

        <div class="game-info">

            <img
                id="gameLogo"
                src=""
                alt="Logo Game">

            <div>

                <h1 id="gameName">
                    Memuat...
                </h1>

                <p id="gameCategory">
                    Game Top Up
                </p>

            </div>

        </div>

    </header>

    <!-- Banner -->
    <section class="banner">

        <img
            id="gameBanner"
            src=""
            alt="Banner">

    </section>

    <!-- Input ID -->
    <section class="user-id">

        <h2>Masukkan ID Game</h2>

        <div class="input-group">

            <input
                type="text"
                id="userId"
                placeholder="User ID">

            <input
                type="text"
                id="zoneId"
                placeholder="Zone ID">

        </div>

    </section>

    <!-- Daftar Diamond -->
    <section class="diamond-section">

        <h2>Pilih Nominal</h2>

        <div
            class="diamond-grid"
            id="diamondList">

            <!-- Diisi oleh JavaScript -->

        </div>

    </section>

    <!-- Tombol -->
    <section class="bottom-action">

        <button id="continueButton">

            Lanjutkan

        </button>

    </section>

    <!-- JavaScript -->
    <script src="topup.js"></script>

</body>
</html>
